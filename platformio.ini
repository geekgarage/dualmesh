; DualMesh – LilyGo T-Deck Plus (ESP32-S3FN16R8: 16 MB flash, 8 MB OPI PSRAM)
[platformio]
default_envs = tdeck_plus

[env:tdeck_plus]
; Låst: koden er skrevet til Arduino-ESP32 2.0.14 / ESP-IDF 4.4.6 (espressif32 6.5.0).
; Uden låsning henter en ny PC den nyeste platform (8.x = Arduino 3 / IDF 5), som ikke bygger.
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; MeshCore (fase 2). Kapacitet som MeshCores egen T-Deck-variant.
    -DMAX_CONTACTS=350
    -DMAX_GROUP_CHANNELS=40
    ; LVGL (fase 4): konfigurationen ligger i include/lv_conf.h
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; Firmwareversionens git-hash (src/version.h, "Omkring" i Indst.)
    !python tools/git_rev.py

; MeshCore (MIT, Scott Powell / rippleradios.com): udvalgte filer ligger låst i lib/meshcore
; (hentes med tools/sync_meshcore.py), så vi ikke bygger MeshCores egne board-/radiodrivere.
lib_deps =
    rweather/Crypto @ ^0.4.0
    densaugeo/base64 @ ~1.4.0
    ; LVGL (MIT) til brugerfladen (fase 4)
    lvgl/lvgl @ 8.4.0

upload_speed = 921600
monitor_speed = 115200
; log2file gemmer loggen som platformio-device-monitor-*.log i projektmappen
monitor_filters = time, esp32_exception_decoder, log2file

# SPDX-License-Identifier: MIT
# GitHub Pages ved ændringer i docs/ på main: fejlrapport-siden, flash-siden og firmwaren fra den
# seneste release (så flash-siden altid har en firmware, også når kun siderne ændres).
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byg siden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/flash/firmware
          cp -r docs/. _site/
          # Den seneste release (findes der ingen endnu, viser flash-siden det).
          gh release download --repo "${GITHUB_REPOSITORY}" --dir _site/flash/firmware \
            --pattern '*.bin' --pattern manifest.json --pattern version.txt || echo "ingen release endnu"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

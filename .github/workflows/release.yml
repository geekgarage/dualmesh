# SPDX-License-Identifier: MIT
# Udgivelse: et tag "v<version>" (samme som DM_FW_VERSION i src/version.h) bygger firmwaren,
# laver en GitHub-release med filerne fra tools/release.py og starter pages.yml, der lægger den nye
# firmware på flash-siden. T-Deck'ens "Opdatér firmware" læser releases/latest/download/version.txt.
#   git tag v0.1.1 && git push origin v0.1.1
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Installér PlatformIO
        run: pip install platformio
      - name: Tjek at tagget passer med src/version.h
        run: python tools/release.py check "${GITHUB_REF_NAME}"
      - name: Byg firmwaren
        run: pio run -e tdeck_plus
      - name: Pak udgivelsen
        run: python tools/release.py package dist
      - name: Opret releasen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.bin dist/version.txt dist/manifest.json dist/dualmesh-licenses.zip \
            --title "DualMesh ${GITHUB_REF_NAME}" --notes-file dist/notes.md --latest
      # Pages må kun udgives fra main (miljøets beskyttelse), så Pages-workflowet startes på main;
      # det henter firmwaren fra den release, der lige er lavet.
      - name: Opdatér flash-siden på GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

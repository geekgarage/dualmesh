# SPDX-License-Identifier: MIT
# Fejlrapport-skabelonen. Felternes id'er (version, opstart, nedbrud) udfyldes fra T-Deck'ens
# QR-kode (lib/dualmesh/src/diag_report.cpp) og fra fejlrapport-siden (docs/rapport/index.html).
name: Fejlrapport
description: Nedbrud eller fejl i DualMesh-firmwaren
title: "Fejlrapport: "
labels: ["fejlrapport"]
body:
  - type: markdown
    attributes:
      value: |
        Tak, fordi du melder fejlen! Den fulde log laver du på
        [fejlrapport-siden](https://geekgarage.github.io/dualmesh/rapport/): den henter loggen fra
        T-Deck'en over USB og renser den på din egen computer for navne, beskeder, positioner,
        nøgler og adresser. Træk den rensede .txt-fil ind i feltet **Log** herunder.

        **Del aldrig en urenset log.** Issues er offentlige, og loggen kan indeholde din position,
        dine beskeder og dit WiFi-navn.
  - type: input
    id: version
    attributes:
      label: Firmwareversion
      description: Står i Indst. > System > Omkring (udfyldes automatisk fra QR-koden/siden).
      placeholder: "0.1.0 (c48036d) T-Deck Plus"
    validations:
      required: true
  - type: input
    id: opstart
    attributes:
      label: Opstartsårsag
      description: Hvorfor T-Deck'en sidst startede, fx PANIC, TASK_WDT eller BROWNOUT.
  - type: textarea
    id: nedbrud
    attributes:
      label: Nedbrud
      description: Udfyldes automatisk (fejltype, opgave, adresser og ELF-hash). Ret det ikke.
      render: text
  - type: textarea
    id: beskrivelse
    attributes:
      label: Hvad skete der?
      description: Hvad lavede du, hvad forventede du, og hvad skete der i stedet?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Træk den rensede rapport (.txt) fra fejlrapport-siden herind.
  - type: checkboxes
    id: privatliv
    attributes:
      label: Privatliv
      options:
        - label: Loggen er renset på fejlrapport-siden, og jeg har læst den igennem.

<!DOCTYPE html>
<!-- SPDX-License-Identifier: MIT -->
<!-- Forsiden på GitHub Pages (geekgarage.github.io/dualmesh/): kort om DualMesh og vej videre til
     flash-siden, repoet og fejlrapport-siden. Engelsk som standard, dansk med knappen eller ?lang=da. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DualMesh</title>
<meta name="description" content="DualMesh: MeshCore and Meshtastic at the same time on one radio, for the LilyGo T-Deck Plus.">
<meta property="og:title" content="DualMesh – one handheld, both mesh networks">
<meta property="og:description" content="MeshCore and Meshtastic at the same time on one radio, for the LilyGo T-Deck Plus. Open source, MIT.">
<meta property="og:image" content="https://raw.githubusercontent.com/geekgarage/dualmesh/main/assets/social/dualmesh-social-en.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #0a1014; --panel: #121c21; --line: #283840; --text: #e8ecee; --dim: #96a6ac;
    --green: #4ade80; --blue: #38bdf8;
    --mono: ui-monospace, "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 40px 20px 64px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 64px; height: 64px; }
  .brand b { font-size: 24px; }
  h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.15; margin: 34px 0 12px; text-wrap: balance; }
  h1 span { color: var(--green); }
  .lead { color: var(--dim); max-width: 62ch; margin: 0 0 26px; font-size: 17px; }
  .mc { color: var(--blue); } .mt { color: var(--green); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 34px; }
  .btn { display: inline-block; text-decoration: none; padding: 11px 18px; border-radius: 8px;
         border: 1px solid var(--line); color: var(--text); background: var(--panel); font-weight: 600; }
  .btn.primary { background: var(--green); color: #062b16; border-color: var(--green); }
  .btn:hover { border-color: var(--green); }
  .btn:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  ul.feat { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  ul.feat li { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  ul.feat b { display: block; margin-bottom: 2px; }
  ul.feat span { color: var(--dim); font-size: 14.5px; }
  .foot { color: var(--dim); font-size: 13.5px; margin-top: 30px; }
  a { color: #9cc8ff; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  button[aria-pressed=true] { border-color: var(--green); color: var(--green); }
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><img src="https://raw.githubusercontent.com/geekgarage/dualmesh/main/assets/logo/png/dualmesh-logo-dark-128.png" alt=""><b>DualMesh</b></div>
    <div role="group" aria-label="Language / Sprog">
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="da">Dansk</button>
    </div>
  </div>
  <h1 data-t="h1"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="actions">
    <a class="btn primary" id="a-flash" href="flash/" data-t="install"></a>
    <a class="btn" href="https://github.com/geekgarage/dualmesh" data-t="github"></a>
    <a class="btn" href="https://github.com/geekgarage/dualmesh/releases/latest" data-t="download"></a>
    <a class="btn" id="a-report" href="rapport/" data-t="report"></a>
  </div>
  <ul class="feat">
    <li><b data-t="f1"></b><span data-t="f1d"></span></li>
    <li><b data-t="f2"></b><span data-t="f2d"></span></li>
    <li><b data-t="f3"></b><span data-t="f3d"></span></li>
    <li><b data-t="f4"></b><span data-t="f4d"></span></li>
  </ul>
  <p class="foot" data-t="foot"></p>
</main>
<script>
'use strict';
var TEXT = {
  en: {
    h1: 'One handheld.<br><span>Both mesh networks.</span>',
    lead: 'DualMesh turns a LilyGo T-Deck Plus into a stand-alone off-grid communicator that talks ' +
          '<span class="mc">MeshCore</span> and <span class="mt">Meshtastic</span> at the same time on one radio – ' +
          'with a real keyboard, offline maps and GPS, and no phone required.',
    install: 'Install in your browser', github: 'GitHub', download: 'Download', report: 'Report a bug',
    f1: 'Both networks', f1d: 'Channels and encrypted DMs on MeshCore and Meshtastic from one device.',
    f2: 'Offline maps', f2d: 'Maps of whole countries, GPS tracks, shared locations and geocaching.',
    f3: 'SOS', f3d: 'Sends your position on both networks at once. Private by default.',
    f4: 'Easy updates', f4d: 'Install from the browser, then update over WiFi from the menu.',
    foot: 'Open source, MIT. Compatible with MeshCore and Meshtastic, not affiliated with either project.'
  },
  da: {
    h1: 'Én håndholdt.<br><span>Begge mesh-net.</span>',
    lead: 'DualMesh gør en LilyGo T-Deck Plus til en selvstændig off-grid-kommunikator, der taler ' +
          '<span class="mc">MeshCore</span> og <span class="mt">Meshtastic</span> på samme tid med én radio – ' +
          'med rigtigt tastatur, offline-kort og GPS, og uden telefon.',
    install: 'Installér i browseren', github: 'GitHub', download: 'Hent', report: 'Meld en fejl',
    f1: 'Begge net', f1d: 'Kanaler og krypterede DM\'er på MeshCore og Meshtastic fra én enhed.',
    f2: 'Offline-kort', f2d: 'Kort over hele lande, GPS-spor, delte lokationer og geocaching.',
    f3: 'SOS', f3d: 'Sender din position på begge net på én gang. Privat som standard.',
    f4: 'Nemme opdateringer', f4d: 'Installér fra browseren, og opdatér derefter over WiFi fra menuen.',
    foot: 'Open source, MIT. Kompatibel med MeshCore og Meshtastic, uden tilknytning til projekterne.'
  }
};
function setLang(l) {
  var L = TEXT[l] ? l : 'en';
  try { localStorage.setItem('dm-lang', L); } catch (e) {}
  document.documentElement.lang = L;
  document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = TEXT[L][el.getAttribute('data-t')]; });
  document.querySelectorAll('[data-lang]').forEach(function (b) {
    b.setAttribute('aria-pressed', b.getAttribute('data-lang') === L ? 'true' : 'false');
  });
  var q = L === 'da' ? '?lang=da' : '';
  document.getElementById('a-flash').href = 'flash/' + q;
  document.getElementById('a-report').href = 'rapport/' + q;
}
document.querySelectorAll('[data-lang]').forEach(function (b) {
  b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
});
(function () {
  var q = /[?&]lang=(\w+)/.exec(location.search), saved = null;
  try { saved = localStorage.getItem('dm-lang'); } catch (e) {}
  setLang(q ? q[1] : (saved || 'en'));
})();
</script>
</body>
</html>
